<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>途線 TabiLine — 管理者後台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#1A1714;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;}
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-card{background:#2B2620;border-radius:24px;padding:40px 32px;width:100%;max-width:380px;text-align:center;}
.login-logo{font-size:48px;margin-bottom:16px;}
.login-title{font-size:22px;font-weight:700;color:#FFC233;margin-bottom:6px;}
.login-sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:32px;}
.login-field{margin-bottom:14px;text-align:left;}
.login-field label{display:block;font-size:11px;color:rgba(255,255,255,.5);margin-bottom:5px;font-weight:500;}
.login-field input{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-size:14px;}
.login-field input:focus{outline:none;border-color:#FFC233;}
.login-btn{width:100%;padding:13px;background:#FFC233;color:#2B2620;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;}
.login-err{font-size:12px;color:#E24B4A;margin-top:10px;min-height:18px;}
.admin-app{display:none;min-height:100vh;}
.admin-header{background:#2B2620;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08);}
.admin-logo{font-size:24px;}
.admin-app-title{font-size:16px;font-weight:700;color:#FFC233;}
.admin-app-sub{font-size:11px;color:rgba(255,255,255,.4);}
.admin-logout{background:rgba(255,255,255,.08);border:none;color:rgba(255,255,255,.6);padding:7px 14px;border-radius:10px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.admin-body{max-width:960px;margin:0 auto;padding:28px 20px;}
.admin-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:28px;}
.stat-card{background:#2B2620;border-radius:16px;padding:16px 18px;}
.stat-num{font-size:28px;font-weight:700;color:#FFC233;}
.stat-label{font-size:12px;color:rgba(255,255,255,.4);margin-top:3px;}
.admin-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:20px;}
@media(max-width:700px){.admin-grid{grid-template-columns:1fr;}}
.admin-card{background:#2B2620;border-radius:20px;padding:22px 20px;}
.admin-card-title{font-size:14px;font-weight:700;color:#FFC233;margin-bottom:4px;display:flex;align-items:center;gap:7px;}
.admin-card-sub{font-size:11px;color:rgba(255,255,255,.4);margin-bottom:18px;}
.a-field{margin-bottom:11px;}
.a-field label{display:block;font-size:10px;color:rgba(255,255,255,.45);margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:.4px;}
.a-field input,.a-field select,.a-field textarea{width:100%;padding:9px 13px;border-radius:11px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-size:13px;font-family:inherit;}
.a-field textarea{resize:vertical;min-height:60px;}
.a-field input:focus,.a-field select:focus,.a-field textarea:focus{outline:none;border-color:#FFC233;}
.a-field input::placeholder,.a-field textarea::placeholder{color:rgba(255,255,255,.25);}
.a-field select option{background:#2B2620;color:#fff;}
.a-field-row{display:flex;gap:8px;}
.a-field-row .a-field{flex:1;}
.a-hint{font-size:10px;color:rgba(255,255,255,.3);margin-top:4px;line-height:1.5;}
.a-hint b{color:#FFC233;}
.region-examples{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.region-tag{font-size:10px;background:rgba(255,194,51,.12);color:#FFC233;border:1px solid rgba(255,194,51,.25);padding:2px 8px;border-radius:8px;cursor:pointer;}
.a-submit{width:100%;padding:11px;background:#FFC233;color:#2B2620;border:none;border-radius:13px;font-size:13px;font-weight:700;cursor:pointer;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px;}
.a-submit:disabled{opacity:.5;cursor:not-allowed;}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.filter-btn{padding:5px 12px;border-radius:10px;font-size:11px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.5);cursor:pointer;font-weight:500;}
.filter-btn.active{background:#FFC233;color:#2B2620;border-color:#FFC233;font-weight:700;}
.search-bar{width:100%;padding:8px 12px;border-radius:11px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-size:13px;margin-bottom:12px;}
.search-bar:focus{outline:none;border-color:#FFC233;}
.search-bar::placeholder{color:rgba(255,255,255,.25);}
.spot-list{display:flex;flex-direction:column;gap:7px;max-height:560px;overflow-y:auto;}
.spot-list::-webkit-scrollbar{width:4px;}
.spot-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:10px;}
.spot-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 13px;transition:background .15s;}
.spot-row:hover{background:rgba(255,255,255,.09);}
.spot-row-icon{font-size:20px;flex-shrink:0;}
.spot-row-info{flex:1;min-width:0;}
.spot-row-name{font-size:13px;font-weight:600;color:#fff;}
.spot-row-meta{font-size:10px;color:rgba(255,255,255,.35);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.spot-row-region{font-size:10px;color:#FFC233;margin-top:2px;}
.spot-row-actions{display:flex;gap:6px;flex-shrink:0;}
.spot-row-del,.spot-row-edit{width:28px;height:28px;border-radius:50%;border:none;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.spot-row-del{background:rgba(255,255,255,.08);color:rgba(255,255,255,.4);}
.spot-row-del:hover{background:#E24B4A;color:#fff;}
.spot-row-edit{background:rgba(255,194,51,.12);color:#FFC233;}
.spot-row-edit:hover{background:#FFC233;color:#2B2620;}
.empty-list{text-align:center;padding:32px;font-size:13px;color:rgba(255,255,255,.25);}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#FFC233;color:#2B2620;font-size:12px;font-weight:600;padding:9px 20px;border-radius:20px;opacity:0;transition:all .25s;white-space:nowrap;z-index:999;pointer-events:none;}
.toast.show{opacity:1;}
.bulk-import{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);}
.bulk-title{font-size:11px;color:rgba(255,255,255,.4);margin-bottom:8px;font-weight:500;}
.bulk-presets{display:flex;flex-wrap:wrap;gap:6px;}
.bulk-preset-btn{font-size:11px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6);padding:5px 11px;border-radius:10px;cursor:pointer;}
.bulk-preset-btn:hover{background:rgba(255,194,51,.15);border-color:#FFC233;color:#FFC233;}

<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">✈️</div>
    <div class="login-title">途線 TabiLine</div>
    <div class="login-sub">管理者後台 — 請輸入密碼</div>
    <div class="login-field">
      <label>管理者密碼</label>
      <input type="password" id="pwInput" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">進入後台</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div class="admin-app" id="adminApp">
  <div class="admin-header">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="admin-logo">✈️</div>
      <div><div class="admin-app-title">途線 TabiLine 後台</div><div class="admin-app-sub">景點資料庫管理</div></div>
    </div>
    <button class="admin-logout" onclick="doLogout()"><i class="ti ti-logout"></i>登出</button>
  </div>

  <div class="admin-body">
    <div class="admin-stats">
      <div class="stat-card"><div class="stat-num" id="statTotal">—</div><div class="stat-label">景點總數</div></div>
      <div class="stat-card"><div class="stat-num" id="statCats">—</div><div class="stat-label">分類數</div></div>
      <div class="stat-card"><div class="stat-num" id="statRegions">—</div><div class="stat-label">地區數</div></div>
    </div>

    <div class="admin-grid">
      <!-- 新增景點 -->
      <div class="admin-card">
        <div class="admin-card-title"><i class="ti ti-plus"></i>新增景點</div>
        <div class="admin-card-sub">新增後即時同步到使用者 App 的推薦選單</div>
        <div class="a-field-row">
          <div class="a-field" style="flex:2"><label>景點名稱</label><input id="aName" placeholder="例：嵐山竹林"/></div>
          <div class="a-field" style="flex:0.7"><label>Emoji</label><input id="aIcon" placeholder="🏯" maxlength="2"/></div>
        </div>
        <div class="a-field">
          <label>分類</label>
          <select id="aCat">
            <option>文化・歷史</option>
            <option>美食</option>
            <option>自然</option>
            <option>購物</option>
            <option>景點</option>
            <option>交通</option>
            <option>住宿</option>
          </select>
        </div>
        <div class="a-field">
          <label>地區（格式：城市・國家）</label>
          <input id="aRegion" placeholder="例：京都・日本"/>
          <div class="a-hint">⚠️ 格式很重要！使用者輸入「<b>京都</b>」時，App 會比對地區欄位來過濾景點。請統一用「城市・國家」格式。</div>
          <div class="region-examples" id="regionExamples"></div>
        </div>
        <div class="a-field"><label>簡介（顯示在選單旁）</label><input id="aDesc" placeholder="例：世界遺產・必訪"/></div>
        <button class="a-submit" id="addBtn" onclick="addSpot()"><i class="ti ti-cloud-upload"></i>新增到資料庫</button>

        <!-- 批量匯入預設景點 -->
        <div class="bulk-import">
          <div class="bulk-title">批量匯入預設景點組</div>
          <div class="bulk-presets">
            <button class="bulk-preset-btn" onclick="importPreset('tokyo')">🗼 東京</button>
            <button class="bulk-preset-btn" onclick="importPreset('kyoto')">⛩ 京都</button>
            <button class="bulk-preset-btn" onclick="importPreset('osaka')">🍜 大阪</button>
            <button class="bulk-preset-btn" onclick="importPreset('nagoya')">🏯 名古屋</button>
            <button class="bulk-preset-btn" onclick="importPreset('takayama')">🌅 高山</button>
            <button class="bulk-preset-btn" onclick="importPreset('kamikochi')">🏔 上高地</button>
            <button class="bulk-preset-btn" onclick="importPreset('taipei')">🏙 台北</button>
            <button class="bulk-preset-btn" onclick="importPreset('seoul')">🏯 首爾</button>
            <button class="bulk-preset-btn" onclick="importPreset('bangkok')">🛕 曼谷</button>
            <button class="bulk-preset-btn" onclick="importPreset('paris')">🗼 巴黎</button>
          </div>
        </div>
      </div>

      <!-- 景點列表 -->
      <div class="admin-card">
        <div class="admin-card-title"><i class="ti ti-list"></i>景點列表</div>
        <div class="admin-card-sub" id="listSub">載入中…</div>
        <input class="search-bar" id="searchBar" placeholder="🔍 搜尋景點名稱或地區…" oninput="renderList()">
        <div class="filter-row" id="filterRow"></div>
        <div class="spot-list" id="spotList"><div class="empty-list">連接 Firebase 中…</div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

    {icon:'⛪',name:'聖母院',cat:'文化・歷史',region:'巴黎・法國',desc:'哥德式建築・歷史'},
    {icon:'🥐',name:'蒙馬特',cat:'景點',region:'巴黎・法國',desc:'藝術家聚落・夜景'},
    {icon:'🛍',name:'香榭麗舍大道',cat:'購物',region:'巴黎・法國',desc:'奢侈品・名店林立'},
  ],
};

// 常用地區快速標籤
const REGION_QUICK = ['名古屋・日本','高山・日本','上高地・日本','東京・日本','京都・日本','大阪・日本','台北・台灣','首爾・韓國','曼谷・泰國','巴黎・法國'];

function doLogin(){
  const pw=document.getElementById('pwInput').value;
  if(pw===ADMIN_PASSWORD){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('adminApp').style.display='block';
    initAdmin();
  }else{
    document.getElementById('loginErr').textContent='密碼錯誤，請再試一次';
    document.getElementById('pwInput').value='';
  }
}
function doLogout(){
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('adminApp').style.display='none';
  document.getElementById('pwInput').value='';
}

function initAdmin(){
  // Render region quick tags
  const wrap=document.getElementById('regionExamples');
  REGION_QUICK.forEach(r=>{
    const btn=document.createElement('button');btn.className='region-tag';btn.textContent=r;
    btn.onclick=()=>document.getElementById('aRegion').value=r;
    wrap.appendChild(btn);
  });
  // Listen spots
  db.collection('spots').onSnapshot(snap=>{
    allSpots=snap.docs.map(d=>({id:d.id,...d.data()}));
    allSpots.sort((a,b)=>(a.region||'').localeCompare(b.region||'','zh')||(a.name||'').localeCompare(b.name||'','zh'));
    renderStats();renderFilter();renderList();
  });
}

function renderStats(){
  document.getElementById('statTotal').textContent=allSpots.length;
  document.getElementById('statCats').textContent=new Set(allSpots.map(s=>s.cat)).size;
  document.getElementById('statRegions').textContent=new Set(allSpots.map(s=>s.region)).size;
  document.getElementById('listSub').textContent=`共 ${allSpots.length} 個景點`;
}

function renderFilter(){
  const cats=['全部',...new Set(allSpots.map(s=>s.cat))];
  const row=document.getElementById('filterRow');row.innerHTML='';
  cats.forEach(cat=>{
    const btn=document.createElement('button');btn.className='filter-btn'+(cat===catFilter?' active':'');
    btn.textContent=cat;btn.onclick=()=>{catFilter=cat;renderFilter();renderList();};row.appendChild(btn);
  });
}

function renderList(){
  const list=document.getElementById('spotList');
  const q=(document.getElementById('searchBar').value||'').toLowerCase();
  let filtered=catFilter==='全部'?allSpots:allSpots.filter(s=>s.cat===catFilter);
  if(q)filtered=filtered.filter(s=>(s.name||'').toLowerCase().includes(q)||(s.region||'').toLowerCase().includes(q));
  if(!filtered.length){list.innerHTML='<div class="empty-list">找不到符合的景點</div>';return;}
  list.innerHTML='';
  filtered.forEach(s=>{
    const row=document.createElement('div');row.className='spot-row';
    row.innerHTML=`<div class="spot-row-icon">${s.icon||'📍'}</div>
      <div class="spot-row-info">
        <div class="spot-row-name">${s.name}</div>
        <div class="spot-row-region">${s.region||'—'}</div>
        <div class="spot-row-meta">${s.cat}${s.desc?' · '+s.desc:''}</div>
      </div>
      <div class="spot-row-actions">
        <button class="spot-row-del" onclick="deleteSpot('${s.id}','${(s.name||'').replace(/'/g,"\\'")}')"><i class="ti ti-trash"></i></button>
      </div>`;
    list.appendChild(row);
  });
}

async function addSpot(){
  const name=document.getElementById('aName').value.trim();
  const icon=document.getElementById('aIcon').value.trim()||'📍';
  const cat=document.getElementById('aCat').value;
  const region=document.getElementById('aRegion').value.trim();
  const desc=document.getElementById('aDesc').value.trim();
  if(!name){showToast('請輸入景點名稱');return;}
  if(!region){showToast('請輸入地區（格式：城市・國家）');return;}
  if(!region.includes('・')){showToast('⚠️ 地區格式應為「城市・國家」，例如：京都・日本');return;}
  const btn=document.getElementById('addBtn');btn.disabled=true;
  try{
    await db.collection('spots').add({icon,name,cat,region,desc,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    document.getElementById('aName').value='';document.getElementById('aIcon').value='';document.getElementById('aDesc').value='';
    showToast(`「${name}」已新增 ✓`);
  }catch(e){showToast('新增失敗：'+e.message);}
  btn.disabled=false;
}

async function deleteSpot(id,name){
  if(!confirm(`確定刪除「${name}」？`))return;
  try{await db.collection('spots').doc(id).delete();showToast(`「${name}」已刪除`);}
  catch(e){showToast('刪除失敗：'+e.message);}
}

async function importPreset(key){
  const spots=PRESET_SPOTS[key];if(!spots){showToast('找不到預設資料');return;}
  const existing=new Set(allSpots.map(s=>s.name));
  const toAdd=spots.filter(s=>!existing.has(s.name));
  if(!toAdd.length){showToast('此組景點已全部存在');return;}
  if(!confirm(`匯入 ${toAdd.length} 個景點（已存在的會跳過）？`))return;
  let count=0;
  for(const s of toAdd){
    try{await db.collection('spots').add({...s,createdAt:firebase.firestore.FieldValue.serverTimestamp()});count++;}
    catch(e){console.warn(e);}
  }
  showToast(`✓ 已匯入 ${count} 個景點`);
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
</script>
</body>
