<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>途線 TabiLine — 管理者後台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#F2F2F7;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;color:#1C1C1E;}

/* Login */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-card{background:#fff;border-radius:18px;padding:40px 32px;width:100%;max-width:360px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.login-logo{font-size:44px;margin-bottom:16px;}
.login-title{font-size:22px;font-weight:700;color:#1C1C1E;margin-bottom:4px;}
.login-sub{font-size:14px;color:#8E8E93;margin-bottom:32px;}
.login-field{margin-bottom:14px;text-align:left;}
.login-field label{display:block;font-size:12px;color:#8E8E93;margin-bottom:5px;font-weight:500;}
.login-field input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid #D1D1D6;background:#F9F9F9;color:#1C1C1E;font-size:15px;}
.login-field input:focus{outline:none;border-color:#007AFF;background:#fff;}
.login-btn{width:100%;padding:13px;background:#007AFF;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;}
.login-btn:active{background:#0062CC;}
.login-err{font-size:13px;color:#FF3B30;margin-top:10px;min-height:18px;}

/* Admin app */
.admin-app{display:none;min-height:100vh;}
.admin-header{background:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E5E5EA;}
.admin-header-left{display:flex;align-items:center;gap:12px;}
.admin-logo{font-size:22px;}
.admin-app-title{font-size:17px;font-weight:600;color:#1C1C1E;}
.admin-app-sub{font-size:12px;color:#8E8E93;margin-top:1px;}
.admin-logout{background:#F2F2F7;border:none;color:#3C3C43;padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:5px;}
.admin-logout:hover{background:#E5E5EA;}

.admin-body{max-width:980px;margin:0 auto;padding:24px 20px;}

/* Stats */
.admin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:#fff;border-radius:14px;padding:16px 18px;border:1px solid #E5E5EA;}
.stat-num{font-size:28px;font-weight:700;color:#007AFF;}
.stat-label{font-size:12px;color:#8E8E93;margin-top:3px;}

/* Grid */
.admin-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:16px;}
@media(max-width:700px){.admin-grid{grid-template-columns:1fr;}}
.admin-card{background:#fff;border-radius:16px;padding:20px;border:1px solid #E5E5EA;}
.admin-card-title{font-size:15px;font-weight:600;color:#1C1C1E;margin-bottom:3px;display:flex;align-items:center;gap:7px;}
.admin-card-sub{font-size:12px;color:#8E8E93;margin-bottom:18px;}

/* Form */
.a-field{margin-bottom:12px;}
.a-field label{display:block;font-size:12px;color:#8E8E93;margin-bottom:4px;font-weight:500;}
.a-field input,.a-field select{width:100%;padding:9px 12px;border-radius:9px;border:1px solid #D1D1D6;background:#F9F9F9;color:#1C1C1E;font-size:14px;font-family:inherit;}
.a-field input:focus,.a-field select:focus{outline:none;border-color:#007AFF;background:#fff;}
.a-field input::placeholder{color:#C7C7CC;}
.a-field-row{display:flex;gap:8px;}
.a-field-row .a-field{flex:1;}
.a-hint{font-size:11px;color:#8E8E93;margin-top:4px;line-height:1.5;}
.a-hint b{color:#007AFF;}
.region-examples{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.region-tag{font-size:11px;background:#F2F2F7;color:#007AFF;border:1px solid #D1D1D6;padding:3px 9px;border-radius:7px;cursor:pointer;font-weight:500;}
.region-tag:hover{background:#E5F0FF;}
.a-submit{width:100%;padding:11px;background:#007AFF;color:#fff;border:none;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;}
.a-submit:hover{background:#0062CC;}
.a-submit:disabled{opacity:.4;cursor:not-allowed;}

/* Bulk import */
.bulk-import{margin-top:16px;padding-top:16px;border-top:1px solid #E5E5EA;}
.bulk-title{font-size:12px;color:#8E8E93;margin-bottom:8px;font-weight:500;}
.bulk-presets{display:flex;flex-wrap:wrap;gap:6px;}
.bulk-preset-btn{font-size:12px;background:#F2F2F7;border:1px solid #D1D1D6;color:#3C3C43;padding:5px 12px;border-radius:8px;cursor:pointer;font-weight:500;}
.bulk-preset-btn:hover{background:#E5F0FF;border-color:#007AFF;color:#007AFF;}

/* List */
.search-bar{width:100%;padding:8px 12px;border-radius:9px;border:1px solid #D1D1D6;background:#F9F9F9;color:#1C1C1E;font-size:14px;margin-bottom:12px;font-family:inherit;}
.search-bar:focus{outline:none;border-color:#007AFF;background:#fff;}
.search-bar::placeholder{color:#C7C7CC;}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.filter-btn{padding:5px 12px;border-radius:8px;font-size:12px;border:1px solid #D1D1D6;background:#F2F2F7;color:#3C3C43;cursor:pointer;font-weight:500;}
.filter-btn.active{background:#007AFF;color:#fff;border-color:#007AFF;}
.spot-list{display:flex;flex-direction:column;gap:6px;max-height:540px;overflow-y:auto;}
.spot-list::-webkit-scrollbar{width:4px;}
.spot-list::-webkit-scrollbar-thumb{background:#D1D1D6;border-radius:10px;}
.spot-row{display:flex;align-items:center;gap:10px;background:#F9F9F9;border-radius:10px;padding:10px 13px;border:1px solid #E5E5EA;}
.spot-row:hover{background:#F2F2F7;}
.spot-row-info{flex:1;min-width:0;}
.spot-row-name{font-size:14px;font-weight:600;color:#1C1C1E;}
.spot-row-region{font-size:11px;color:#007AFF;margin-top:2px;font-weight:500;}
.spot-row-meta{font-size:11px;color:#8E8E93;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.spot-row-del{width:28px;height:28px;border-radius:7px;background:#FFE5E5;border:none;color:#FF3B30;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.spot-row-del:hover{background:#FF3B30;color:#fff;}
.empty-list{text-align:center;padding:32px;font-size:13px;color:#8E8E93;}
.list-sub{font-size:12px;color:#8E8E93;margin-bottom:10px;}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1C1C1E;color:#fff;font-size:13px;font-weight:500;padding:10px 20px;border-radius:20px;opacity:0;transition:all .25s;white-space:nowrap;z-index:999;pointer-events:none;}
.toast.show{opacity:1;}
</style>

<div class="login-screen" id="loginScreen">
  <div class="login-card">

    <div class="login-field">
      <label>密碼</label>
      <input type="password" id="pwInput" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">登入</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div class="admin-app" id="adminApp">

  <div class="admin-body">

    </div>

    <div class="admin-grid">
      <div class="admin-card">

        <div class="a-field-row">

            <input id="aName" placeholder="例：嵐山竹林"/>

            <input id="aIcon" placeholder="留空即可" maxlength="2"/>

        </div>

        <div class="a-field">
          <label>所在地區（城市・國家 格式）</label>
          <input id="aRegion" placeholder="例：京都・日本"/>

          <div class="region-examples" id="regionExamples"></div>
        </div>

        <div class="a-field">
          <label>分類（用地方名稱）</label>
          <select id="aCat">
            <option>東京</option>
            <option>京都</option>
            <option>大阪</option>
            <option>名古屋</option>
            <option>高山</option>
            <option>上高地</option>
            <option>北海道</option>
            <option>沖繩</option>
            <option>台北</option>
            <option>台中</option>
            <option>台南</option>
            <option>高雄</option>
            <option>首爾</option>
            <option>釜山</option>
            <option>曼谷</option>
            <option>清邁</option>
            <option>巴黎</option>
            <option>倫敦</option>
            <option>紐約</option>
            <option>其他</option>
          </select>
        </div>

        <div class="a-field">
          <label>簡介（顯示在 App 選單旁）</label>
          <input id="aDesc" placeholder="例：世界遺產・必訪"/>
        </div>

        <button class="a-submit" id="addBtn" onclick="addSpot()">新增到資料庫</button>

        <div class="bulk-import">
          <div class="bulk-title">批量匯入預設景點</div>
          <div class="bulk-presets">
            <button class="bulk-preset-btn" onclick="importPreset('tokyo')">東京</button>
            <button class="bulk-preset-btn" onclick="importPreset('kyoto')">京都</button>
            <button class="bulk-preset-btn" onclick="importPreset('osaka')">大阪</button>
            <button class="bulk-preset-btn" onclick="importPreset('nagoya')">名古屋</button>
            <button class="bulk-preset-btn" onclick="importPreset('takayama')">高山</button>
            <button class="bulk-preset-btn" onclick="importPreset('kamikochi')">上高地</button>
            <button class="bulk-preset-btn" onclick="importPreset('taipei')">台北</button>
            <button class="bulk-preset-btn" onclick="importPreset('seoul')">首爾</button>
            <button class="bulk-preset-btn" onclick="importPreset('bangkok')">曼谷</button>
            <button class="bulk-preset-btn" onclick="importPreset('paris')">巴黎</button>
          </div>
        </div>
      </div>

      <div class="admin-card">
        <div class="admin-card-title"><i class="ti ti-list" style="color:#007AFF"></i>景點列表</div>
        <div class="list-sub" id="listSub">載入中…</div>
        <input class="search-bar" id="searchBar" placeholder="搜尋景點名稱或地區…" oninput="renderList()">
        <div class="filter-row" id="filterRow"></div>
        <div class="spot-list" id="spotList"><div class="empty-list">連接中…</div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

    document.getElementById('adminApp').style.display='block';
    initAdmin();
  }else{
    document.getElementById('loginErr').textContent='密碼錯誤';
    document.getElementById('pwInput').value='';
  }
}
function doLogout(){
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('adminApp').style.display='none';
  document.getElementById('pwInput').value='';
}

function initAdmin(){
  const wrap=document.getElementById('regionExamples');
  REGION_QUICK.forEach(r=>{
    const btn=document.createElement('button');btn.className='region-tag';btn.textContent=r;
    btn.onclick=()=>{
      document.getElementById('aRegion').value=r;
      // Auto-set cat to city part
      const city=r.split('・')[0];
      const sel=document.getElementById('aCat');
      for(let i=0;i<sel.options.length;i++){if(sel.options[i].value===city){sel.selectedIndex=i;break;}}
    };
    wrap.appendChild(btn);
  });
  db.collection('spots').onSnapshot(snap=>{
    allSpots=snap.docs.map(d=>({id:d.id,...d.data()}));
    allSpots.sort((a,b)=>(a.region||'').localeCompare(b.region||'','zh')||(a.name||'').localeCompare(b.name||'','zh'));
    renderStats();renderFilter();renderList();
  });
}

function renderStats(){
  document.getElementById('statTotal').textContent=allSpots.length;
  document.getElementById('statCats').textContent=new Set(allSpots.map(s=>s.region)).size;
  const countries=new Set(allSpots.map(s=>(s.region||'').split('・')[1]||'').filter(Boolean));
  document.getElementById('statRegions').textContent=countries.size;
  document.getElementById('listSub').textContent=`共 ${allSpots.length} 個景點`;
}

function renderFilter(){
  const cats=['全部',...new Set(allSpots.map(s=>s.cat||s.region||'').filter(Boolean))];
  const row=document.getElementById('filterRow');row.innerHTML='';
  cats.forEach(cat=>{
    const btn=document.createElement('button');btn.className='filter-btn'+(cat===catFilter?' active':'');
    btn.textContent=cat;btn.onclick=()=>{catFilter=cat;renderFilter();renderList();};row.appendChild(btn);
  });
}

function renderList(){
  const list=document.getElementById('spotList');
  const q=(document.getElementById('searchBar').value||'').toLowerCase();
  let filtered=catFilter==='全部'?allSpots:allSpots.filter(s=>(s.cat||s.region||'')===(catFilter));
  if(q)filtered=filtered.filter(s=>(s.name||'').toLowerCase().includes(q)||(s.region||'').toLowerCase().includes(q));
  if(!filtered.length){list.innerHTML='<div class="empty-list">找不到符合的景點</div>';return;}
  list.innerHTML='';
  filtered.forEach(s=>{
    const row=document.createElement('div');row.className='spot-row';
    row.innerHTML=`<div class="spot-row-info">
      <div class="spot-row-name">${s.name}</div>
      <div class="spot-row-region">${s.region||''}</div>
      <div class="spot-row-meta">${s.cat||''}${s.desc?' · '+s.desc:''}</div>
    </div>
    <button class="spot-row-del" onclick="deleteSpot('${s.id}','${(s.name||'').replace(/'/g,"\\'")}')"><i class="ti ti-trash"></i></button>`;
    list.appendChild(row);
  });
}

async function addSpot(){
  const name=document.getElementById('aName').value.trim();
  const icon=document.getElementById('aIcon').value.trim()||'';
  const cat=document.getElementById('aCat').value;
  const region=document.getElementById('aRegion').value.trim();
  const desc=document.getElementById('aDesc').value.trim();
  if(!name){showToast('請輸入景點名稱');return;}
  if(!region){showToast('請輸入地區');return;}
  if(!region.includes('・')){showToast('地區格式應為「城市・國家」');return;}
  const btn=document.getElementById('addBtn');btn.disabled=true;btn.textContent='新增中…';
  try{
    const data={name,cat,region,desc,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
    if(icon)data.icon=icon;
    await db.collection('spots').add(data);
    document.getElementById('aName').value='';
    document.getElementById('aIcon').value='';
    document.getElementById('aDesc').value='';
    showToast(`「${name}」已新增`);
  }catch(e){showToast('新增失敗：'+e.message);}
  btn.disabled=false;btn.textContent='新增到資料庫';
}

async function deleteSpot(id,name){
  if(!confirm(`確定刪除「${name}」？`))return;
  try{await db.collection('spots').doc(id).delete();showToast(`「${name}」已刪除`);}
  catch(e){showToast('刪除失敗：'+e.message);}
}

async function importPreset(key){
  const spots=PRESET_SPOTS[key];if(!spots)return;
  const existing=new Set(allSpots.map(s=>s.name));
  const toAdd=spots.filter(s=>!existing.has(s.name));
  if(!toAdd.length){showToast('此組景點已全部存在');return;}
  if(!confirm(`匯入 ${toAdd.length} 個景點？`))return;
  let count=0;
  for(const s of toAdd){
    try{await db.collection('spots').add({...s,createdAt:firebase.firestore.FieldValue.serverTimestamp()});count++;}
    catch(e){}
  }
  showToast(`已匯入 ${count} 個景點`);
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
</script>
</body>
</html>
