<title>途線 TabiLine — 管理者後台</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#F2F2F7;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;color:#1C1C1E;}
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-card{background:#fff;border-radius:18px;padding:40px 32px;width:100%;max-width:360px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.login-logo{font-size:44px;margin-bottom:16px;}
.login-title{font-size:22px;font-weight:700;color:#1C1C1E;margin-bottom:4px;}
.login-sub{font-size:14px;color:#8E8E93;margin-bottom:32px;}
.login-field{margin-bottom:14px;text-align:left;}
.login-field label{display:block;font-size:12px;color:#8E8E93;margin-bottom:5px;font-weight:500;}
.login-field input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid #D1D1D6;background:#F9F9F9;color:#1C1C1E;font-size:15px;}
.login-field input:focus{outline:none;border-color:#007AFF;background:#fff;}
.login-btn{width:100%;padding:13px;background:#007AFF;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;}
.login-err{font-size:13px;color:#FF3B30;margin-top:10px;min-height:18px;}
.admin-app{display:none;min-height:100vh;}
.admin-header{background:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E5E5EA;}
.admin-header-left{display:flex;align-items:center;gap:12px;}
.admin-app-title{font-size:17px;font-weight:600;color:#1C1C1E;}
.admin-app-sub{font-size:12px;color:#8E8E93;margin-top:1px;}
.admin-logout{background:#F2F2F7;border:none;color:#3C3C43;padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:5px;}
.admin-body{max-width:980px;margin:0 auto;padding:24px 20px;}
.admin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:#fff;border-radius:14px;padding:16px 18px;border:1px solid #E5E5EA;}
.stat-num{font-size:28px;font-weight:700;color:#007AFF;}
.stat-label{font-size:12px;color:#8E8E93;margin-top:3px;}
.admin-grid{display:grid;grid-template-columns:1fr 1.6fr;gap:16px;}
@media(max-width:700px){.admin-grid{grid-template-columns:1fr;}}
.admin-card{background:#fff;border-radius:16px;padding:20px;border:1px solid #E5E5EA;}
.admin-card-title{font-size:15px;font-weight:600;color:#1C1C1E;margin-bottom:3px;display:flex;align-items:center;gap:7px;}
.admin-card-sub{font-size:12px;color:#8E8E93;margin-bottom:18px;}
.a-field{margin-bottom:12px;}
.a-field label{display:block;font-size:12px;color:#8E8E93;margin-bottom:4px;font-weight:500;}
.a-field input{width:100%;padding:9px 12px;border-radius:9px;border:1px solid #D1D1D6;background:#F9F9F9;color:#1C1C1E;font-size:14px;font-family:inherit;}
.a-field input:focus{outline:none;border-color:#007AFF;background:#fff;}
.a-field input::placeholder{color:#C7C7CC;}
/* City search */
.city-search-wrap{position:relative;}
.city-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #D1D1D6;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:100;max-height:200px;overflow-y:auto;display:none;margin-top:4px;}
.city-dropdown.open{display:block;}
.city-option{padding:10px 13px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:0.5px solid #F2F2F7;}
.city-option:last-child{border-bottom:none;}
.city-option:hover{background:#F2F2F7;}
.city-option-name{font-weight:500;color:#1C1C1E;}
.city-option-country{font-size:11px;color:#8E8E93;}
.city-selected-tag{display:inline-flex;align-items:center;gap:6px;background:#E5F0FF;color:#007AFF;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:500;margin-top:6px;}
.city-selected-tag button{background:none;border:none;color:#007AFF;cursor:pointer;font-size:13px;padding:0;line-height:1;}
.a-hint{font-size:11px;color:#8E8E93;margin-top:4px;line-height:1.5;}
.a-hint b{color:#007AFF;}
.a-submit{width:100%;padding:11px;background:#007AFF;color:#fff;border:none;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;}
.a-submit:hover{background:#0062CC;}
.a-submit:disabled{opacity:.4;cursor:not-allowed;}
.bulk-import{margin-top:16px;padding-top:16px;border-top:1px solid #E5E5EA;}
.bulk-title{font-size:12px;color:#8E8E93;margin-bottom:8px;font-weight:500;}
.bulk-presets{display:flex;flex-wrap:wrap;gap:6px;}
.bulk-preset-btn{font-size:12px;background:#F2F2F7;border:1px solid #D1D1D6;color:#3C3C43;padding:5px 12px;border-radius:8px;cursor:pointer;font-weight:500;}
.bulk-preset-btn:hover{background:#E5F0FF;border-color:#007AFF;color:#007AFF;}
/* List */
.search-bar{width:100%;padding:9px 13px;border-radius:10px;border:1px solid #D1D1D6;background:#F9F9F9;color:#1C1C1E;font-size:14px;margin-bottom:12px;font-family:inherit;}
.search-bar:focus{outline:none;border-color:#007AFF;background:#fff;}
.search-bar::placeholder{color:#C7C7CC;}
.spot-list{display:flex;flex-direction:column;gap:1px;max-height:560px;overflow-y:auto;background:#E5E5EA;border-radius:12px;overflow:hidden;}
.spot-list::-webkit-scrollbar{width:4px;}
.spot-list::-webkit-scrollbar-thumb{background:#D1D1D6;border-radius:10px;}
.spot-row{display:flex;align-items:center;gap:10px;background:#fff;padding:11px 14px;}
.spot-row:first-child{border-radius:12px 12px 0 0;}
.spot-row:last-child{border-radius:0 0 12px 12px;}
.spot-row:only-child{border-radius:12px;}
.spot-row-info{flex:1;min-width:0;}
.spot-row-name{font-size:14px;font-weight:500;color:#1C1C1E;}
.spot-row-city{font-size:11px;color:#007AFF;margin-top:2px;font-weight:500;}
.spot-row-del{width:28px;height:28px;border-radius:7px;background:#FFF0F0;border:none;color:#FF3B30;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.spot-row-del:hover{background:#FF3B30;color:#fff;}
.empty-list{text-align:center;padding:32px;font-size:13px;color:#8E8E93;background:#fff;border-radius:12px;}
.list-sub{font-size:12px;color:#8E8E93;margin-bottom:10px;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1C1C1E;color:#fff;font-size:13px;font-weight:500;padding:10px 20px;border-radius:20px;opacity:0;transition:all .25s;white-space:nowrap;z-index:999;pointer-events:none;}
.toast.show{opacity:1;}
</style>

<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">✈️</div>
    <div class="login-title">TabiLine 後台</div>
    <div class="login-sub">請輸入管理者密碼</div>
    <div class="login-field">
      <label>密碼</label>
      <input type="password" id="pwInput" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">登入</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div class="admin-app" id="adminApp">
  <div class="admin-header">
    <div class="admin-header-left">
      <div style="font-size:22px;">✈️</div>
      <div>
        <div class="admin-app-title">TabiLine 後台</div>
        <div class="admin-app-sub">景點資料庫管理</div>
      </div>
    </div>
    <button class="admin-logout" onclick="doLogout()"><i class="ti ti-logout"></i>登出</button>
  </div>

  <div class="admin-body">
    <div class="admin-stats">
      <div class="stat-card"><div class="stat-num" id="statTotal">—</div><div class="stat-label">景點總數</div></div>
      <div class="stat-card"><div class="stat-num" id="statCities">—</div><div class="stat-label">城市數</div></div>
      <div class="stat-card"><div class="stat-num" id="statCountries">—</div><div class="stat-label">國家數</div></div>
    </div>

    <div class="admin-grid">
      <!-- 新增景點 -->
      <div class="admin-card">
        <div class="admin-card-title"><i class="ti ti-plus" style="color:#007AFF"></i>新增景點</div>
        <div class="admin-card-sub">新增後即時同步到使用者 App</div>

        <div class="a-field">
          <label>城市／地方名稱</label>
          <div class="city-search-wrap">
            <input id="aCityInput" placeholder="輸入城市名稱，例如：函館、京都…" autocomplete="off" oninput="onCityInput()" onkeydown="onCityKeydown(event)">
            <div class="city-dropdown" id="cityDropdown"></div>
          </div>
          <div id="citySelectedTag"></div>
          <div class="a-hint">找不到的城市可以直接輸入，按 Enter 確認</div>
        </div>

        <div class="a-field">
          <label>景點名稱</label>
          <input id="aName" placeholder="例：金森紅磚倉庫"/>
        </div>

        <div class="a-field">
          <label>簡介（選填，顯示在 App 選單旁）</label>
          <input id="aDesc" placeholder="例：港口夜景・必訪"/>
        </div>

        <div class="a-field">
          <label>關鍵字（選填，讓其他城市也能搜尋到）</label>
          <input id="aKeywords" placeholder="例：北海道, 日本（逗號分隔）"/>
          <div class="a-hint">例：上高地的景點填「名古屋, 高山」，使用者輸入「名古屋」也能看到</div>
        </div>

        <button class="a-submit" id="addBtn" onclick="addSpot()">新增到資料庫</button>

        <div class="bulk-import">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <div class="bulk-title" style="margin-bottom:0">批量匯入預設景點</div>
            <button onclick="clearAllSpots()" style="font-size:11px;background:#FFF0F0;border:1px solid #FFD0D0;color:#FF3B30;padding:4px 10px;border-radius:7px;cursor:pointer;font-weight:500;">清空全部景點</button>
          </div>
          <div class="bulk-presets">
            <button class="bulk-preset-btn" onclick="importPreset('tokyo')">東京</button>
            <button class="bulk-preset-btn" onclick="importPreset('kyoto')">京都</button>
            <button class="bulk-preset-btn" onclick="importPreset('osaka')">大阪</button>
            <button class="bulk-preset-btn" onclick="importPreset('nagoya')">名古屋</button>
            <button class="bulk-preset-btn" onclick="importPreset('takayama')">高山</button>
            <button class="bulk-preset-btn" onclick="importPreset('kamikochi')">上高地</button>
            <button class="bulk-preset-btn" onclick="importPreset('taipei')">台北</button>
            <button class="bulk-preset-btn" onclick="importPreset('seoul')">首爾</button>
            <button class="bulk-preset-btn" onclick="importPreset('bangkok')">曼谷</button>
            <button class="bulk-preset-btn" onclick="importPreset('paris')">巴黎</button>
          </div>
        </div>
      </div>

      <!-- 景點列表 -->
      <div class="admin-card">
        <div class="admin-card-title"><i class="ti ti-list" style="color:#007AFF"></i>景點列表</div>
        <div class="list-sub" id="listSub">載入中…</div>
        <input class="search-bar" id="searchBar" placeholder="🔍 搜尋景點名稱或城市…" oninput="renderList()">
        <div class="spot-list" id="spotList"><div class="empty-list">連接中…</div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ── Login ──
function doLogin(){
  const pw=document.getElementById('pwInput').value;
  if(pw===ADMIN_PASSWORD){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('adminApp').style.display='block';
    initAdmin();
  }else{
    document.getElementById('loginErr').textContent='密碼錯誤';
    document.getElementById('pwInput').value='';
  }
}
function doLogout(){
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('adminApp').style.display='none';
  document.getElementById('pwInput').value='';
}

// ── City search ──
function onCityInput(){
  const q=document.getElementById('aCityInput').value.trim().toLowerCase();
  const dd=document.getElementById('cityDropdown');
  dropdownIdx=-1;
  if(!q){dd.classList.remove('open');dd.innerHTML='';return;}
  const matches=CITY_DB.filter(c=>
    c.name.toLowerCase().includes(q)||
    c.country.toLowerCase().includes(q)||
    (c.keywords||'').toLowerCase().includes(q)
  ).slice(0,8);
  if(!matches.length){dd.classList.remove('open');return;}
  dd.innerHTML=matches.map((c,i)=>
    `<div class="city-option" onclick="selectCity('${c.name}','${c.country}','${c.keywords||''}')" data-idx="${i}">
      <span class="city-option-name">${c.name}</span>
      <span class="city-option-country">${c.country}</span>
    </div>`
  ).join('');
  dd.classList.add('open');
}

function onCityKeydown(e){
  const dd=document.getElementById('cityDropdown');
  const items=dd.querySelectorAll('.city-option');
  if(e.key==='ArrowDown'){e.preventDefault();dropdownIdx=Math.min(dropdownIdx+1,items.length-1);items.forEach((el,i)=>el.style.background=i===dropdownIdx?'#F2F2F7':'');}
  else if(e.key==='ArrowUp'){e.preventDefault();dropdownIdx=Math.max(dropdownIdx-1,0);items.forEach((el,i)=>el.style.background=i===dropdownIdx?'#F2F2F7':'');}
  else if(e.key==='Enter'){
    e.preventDefault();
    if(dropdownIdx>=0&&items[dropdownIdx]){items[dropdownIdx].click();}
    else{
      // manual entry
      const val=document.getElementById('aCityInput').value.trim();
      if(val) selectCity(val,'','');
    }
    dd.classList.remove('open');
  }
  else if(e.key==='Escape'){dd.classList.remove('open');}
}

function selectCity(name,country,keywords){
  selectedCity={name,country,keywords};
  document.getElementById('aCityInput').value='';
  document.getElementById('cityDropdown').classList.remove('open');
  const tag=document.getElementById('citySelectedTag');
  tag.innerHTML=`<span class="city-selected-tag">${name}${country?' · '+country:''}<button onclick="clearCity()">✕</button></span>`;
}
function clearCity(){
  selectedCity=null;
  document.getElementById('citySelectedTag').innerHTML='';
  document.getElementById('aCityInput').value='';
  document.getElementById('aCityInput').focus();
}

// Click outside to close dropdown
document.addEventListener('click',e=>{
  if(!e.target.closest('.city-search-wrap')) document.getElementById('cityDropdown').classList.remove('open');
});

// ── Init ──
function initAdmin(){
  db.collection('spots').onSnapshot(snap=>{
    allSpots=snap.docs.map(d=>({id:d.id,...d.data()}));
    allSpots.sort((a,b)=>(a.city||'').localeCompare(b.city||'','zh')||(a.name||'').localeCompare(b.name||'','zh'));
    renderStats();renderList();
  });
}

function renderStats(){
  document.getElementById('statTotal').textContent=allSpots.length;
  document.getElementById('statCities').textContent=new Set(allSpots.map(s=>s.city).filter(Boolean)).size;
  document.getElementById('statCountries').textContent=new Set(allSpots.map(s=>s.country).filter(Boolean)).size;
  document.getElementById('listSub').textContent=`共 ${allSpots.length} 個景點`;
}

function renderList(){
  const list=document.getElementById('spotList');
  const q=(document.getElementById('searchBar').value||'').toLowerCase();
  let filtered=q?allSpots.filter(s=>
    (s.name||'').toLowerCase().includes(q)||
    (s.city||'').toLowerCase().includes(q)||
    (s.country||'').toLowerCase().includes(q)
  ):allSpots;
  if(!filtered.length){list.innerHTML='<div class="empty-list">找不到符合的景點</div>';return;}
  list.innerHTML='';
  filtered.forEach(s=>{
    const row=document.createElement('div');row.className='spot-row';
    row.innerHTML=`<div class="spot-row-info">
      <div class="spot-row-name">${s.name}</div>
      <div class="spot-row-city">${s.city||''}${s.country?' · '+s.country:''}</div>
    </div>
    <button class="spot-row-del" onclick="deleteSpot('${s.id}','${(s.name||'').replace(/'/g,"\\'")}')"><i class="ti ti-trash"></i></button>`;
    list.appendChild(row);
  });
}

// ── Add spot ──
async function addSpot(){
  const name=document.getElementById('aName').value.trim();
  const desc=document.getElementById('aDesc').value.trim();
  const keywords=document.getElementById('aKeywords').value.trim();
  if(!name){showToast('請輸入景點名稱');return;}
  if(!selectedCity){showToast('請選擇城市');return;}
  const btn=document.getElementById('addBtn');btn.disabled=true;btn.textContent='新增中…';
  try{
    const data={
      name,
      city:selectedCity.name,
      country:selectedCity.country||'',
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    };
    if(desc)data.desc=desc;
    // merge city keywords with manual keywords
    const cityKw=selectedCity.keywords||'';
    const allKw=[...new Set([...cityKw.split(','),...keywords.split(',')].map(k=>k.trim()).filter(Boolean))].join(', ');
    if(allKw)data.keywords=allKw;
    await db.collection('spots').add(data);
    document.getElementById('aName').value='';
    document.getElementById('aDesc').value='';
    document.getElementById('aKeywords').value='';
    clearCity();
    showToast(`「${name}」已新增`);
  }catch(e){showToast('新增失敗：'+e.message);}
  btn.disabled=false;btn.textContent='新增到資料庫';
}

// ── Delete ──
async function deleteSpot(id,name){
  if(!confirm(`確定刪除「${name}」？`))return;
  try{await db.collection('spots').doc(id).delete();showToast(`「${name}」已刪除`);}
  catch(e){showToast('刪除失敗：'+e.message);}
}

// ── Bulk import ──
async function importPreset(key){
  const spots=PRESET_SPOTS[key];if(!spots)return;
  const existing=new Set(allSpots.map(s=>s.name));
  const toAdd=spots.filter(s=>!existing.has(s.name));
  if(!toAdd.length){showToast('此組景點已全部存在');return;}
  if(!confirm(`匯入 ${toAdd.length} 個景點？`))return;
  let count=0;
  for(const s of toAdd){
    try{
      const data={name:s.name,city:s.city,country:s.country,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
      if(s.desc)data.desc=s.desc;
      if(s.keywords)data.keywords=s.keywords;
      await db.collection('spots').add(data);count++;
    }catch(e){}
  }
  showToast(`已匯入 ${count} 個景點`);
}

async function clearAllSpots(){
  if(allSpots.length===0){showToast('景點資料庫已經是空的');return;}
  if(!confirm(`確定清空全部 ${allSpots.length} 個景點？此動作無法復原。`))return;
  if(!confirm('再次確認：清空後需要重新批量匯入，確定繼續？'))return;
  let count=0;
  for(const s of allSpots){
    try{await db.collection('spots').doc(s.id).delete();count++;}catch(e){}
  }
  showToast(`已清空 ${count} 個景點`);
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
